[package]
name = "tailcat-cli"
description = "The tailcat command: pipe or serve network connections over Tailscale's data plane, without its control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tailcat"
path = "src/main.rs"

[features]
default = ["ssh"]
ssh = ["tailcat/ssh", "dep:russh", "dep:russh-sftp"]

[dependencies]
tailcat.workspace = true
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
hickory-resolver.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
russh = { workspace = true, optional = true }
russh-sftp = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
