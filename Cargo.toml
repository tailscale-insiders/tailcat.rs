[workspace]
resolver = "3"
members = ["crates/tailcat", "crates/tailcat-args", "crates/tailcat-cli", "crates/tailcat-device"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/tailscale-insiders/tailcat.rs"

[workspace.dependencies]
tailcat = { path = "crates/tailcat", version = "0.1.0", default-features = false }
tailcat-args = { path = "crates/tailcat-args", version = "0.1.0" }
anyhow = "1"
base64 = "0.22"
boringtun = { version = "0.7.1", default-features = false }
bytes = "1"
ciborium = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
crypto_box = { version = "0.9", features = ["std"] }
futures = "0.3"
hex = "0.4"
hickory-resolver = "0.26"
hmac = "0.12"
if-addrs = "0.15"
rand = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
russh = { version = "0.63", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
smoltcp = { version = "0.14", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv6", "proto-ipv4", "socket-tcp", "async"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tun-rs = { version = "2", features = ["async"] }
webpki-roots = "1"

[profile.release]
lto = "thin"
strip = true
